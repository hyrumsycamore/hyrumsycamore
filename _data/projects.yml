# _data/projects.yml
completed:
  - title: "Luigi’s Mansion Game (ESP32)"
    image: "photos/luigi_mansion.jpg"
    badges: ["Embedded Systems", "Driver Dev", "Networking"]
    repo_link: "https://github.com/hyrumsycamore/Luigis_Mansion"
    description: |
      Programmed graphics, gameplay, signal input, sound effects, and timer functions for a simplified multiplayer Luigi game on ESP32 devices, using UART for real-time communication and synchronization between two units.

  - title: "Handheld Game Console"
    image: "photos/gameboy"
    badges: ["Raspberry Pi", "PCB Design", "3D Modeling", "SPI", "I2C"] 
    repo_link: "https://github.com/hyrumsycamore/foldable_console"
    description: | 
      Designed a battery-powered retro game emulator with custom PCB, integrated controls, and display; implemented microcontroller interfacing via GPIO, SPI, and I2C.
  
  - title: "New York Times Wordle Solver"
    image: "photos/wordle.png"
    badges: ["Algorithms", "Information Theory", "Optimization"]
    repo_link: "https://github.com/hyrumsycamore/wordler"
    description: | 
      Developed, programmed, and optimized multiple versions of a Wordle solver using letter frequency, word probability, entropy, and information theory. 
  
  - title: "Laser Tag Gun"
    badges: ["ESP32", "PCB Design", "Signal Processing", "Mesh Network"]
    description: |
      Custom-built laser tag system using an ESP32 microcontroller. Features a custom PCB for shot transmission via LED and reception using a photodiode with an amplifying band-pass filter. Implemented a mesh-style ESP-NOW network for gun-to-gun communication and synchronization. Includes a digital display and sound effects for user interactivity.

  - title: "Reverse-Engineered Digital Piano Keys"
    image: "photos/piano"
    badges: ["3D Modeling", "Reverse Engineering", "AutoCAD", "Rapid Prototyping"]
    repo_link: "https://github.com/hyrumsycamore/CVP-103_piano_keys"
    description: |
      Reverse-engineered and 3D printed replacement keys for a Yamaha CVP-103 digital piano. Utilized 3D laser scans of the original parts to create highly accurate models in AutoCAD, iterating through multiple prototypes to perfectly fine-tune the dimensional tolerances and dynamic weighting.
  
  - title: "Baby Cry Neural Net"
    badges: ["Machine Learning", "Neural Network", "PyTorch"]
    description: | 
      Engineered a deep neural network in PyTorch utilizing dropout regularization to classify infant cries by specific need, extracting acoustic audio features to achieve 95% classification accuracy. 
  
  - title: "Predictive Model for E-Commerce Sales"
    badges: ["Machine Learning", "Random Forests", "Polynomial Regression"]
    description: | 
      Developed a Polynomial Regression model using scikit-learn to predict e-commerce sales; implemented data scaling, one-hot encoding, and L1 Regularization to optimize performance, achieving a Mean Squared Error (MSE) of 2209 units.

  - title: "Light Following Robot"
    badges: ["Arduino", "Robotics", "Sensor Fusion"]
    description: |
      Built and programmed an Arduino Nano robot to autonomously follow light and avoid obstacles using multiple sensors and signal filtering.
  
  - title: "Camera Doorbell"
    badges: ["Raspberry Pi", "Threading", "Image Manipulation"]
    description: |
      Developed and programmed a Raspberry Pi Zero system in C with multithreading to capture, filter, and upload images to a school-hosted website, featuring a basic user interface with button input.
  
  

in_progress:
  - title: "ATtiny Educational Robot"
    badges: ["ATtiny", "Bare-Metal C", "Robotics"]
    description: | 
      Developing an educational robotics platform to teach children computational thinking. Building on previous bare-metal ATtiny firmware with custom 1-Wire UART protocols, this project translates the physical sequence of modular instruction bricks into executable code for a remote-controlled robot.
  
  - title: "Autonomous Duckiebot"
    badges: ["ROS", "Robotics", "Control Systems"]
    description: |
      Developing a software stack for an autonomous vehicle using ROS and the Duckietown platform. Implementing PID controllers for closed-loop control, kinematic modeling, and multi-step trajectory planning to enable self-driving navigation.
  
  - title: "Embedded Space Invaders"
    badges: ["C", "Assembly", "Hardware-Software Interface"]
    description: | 
      Engineering a bare-metal implementation of Space Invaders from scratch to explore low-level hardware-software interfacing. Developing custom UIO drivers, low-level audio drivers, and Direct Memory Access (DMA) configurations for optimized system performance.

  - title: "AI-Informed Radiographic Imaging"
    badges: ["Machine Learning", "Computer Vision", "Python", "Team Leadership"]
    description: | 
      Leading a student engineering team to develop a machine learning model focused on deblurring radiographic images. Currently building a custom Python library integrated with a Graphical User Interface (GUI) to provide researchers with an accessible, AI-powered image enhancement tool.