heading: "Introduction"

# The pipe (|) lets you write multiple paragraphs naturally
intro_text: |
  Hi, I'm Hyrum. I am a Computer Engineering student at Brigham Young University graduating in April 2027. 
  I am an absolute builder at heart—when I get a new idea for a project, it plays in my head like a catchy song until I finally build it.

  My primary fascination lies in the intersection of motion and mathematics. 
  I love the beauty of control theory and the ability to use math to model and manipulate physical environments. 

  As an engineer, I thrive on full-system understanding. 
  I am not content just working in one layer; I want to understand how every piece of the puzzle fits together, bridging the gap from custom electrical hardware and low-level firmware to the high-level software that drives it.
